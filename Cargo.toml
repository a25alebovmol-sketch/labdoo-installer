[package]
name = "labdoo-installer"
version = "0.2.0"
edition = "2021"
description = "Safe, inspectable Labdoo/Labtix Clonezilla installer TUI"
license = "GPL-3.0-or-later"
rust-version = "1.74"

[[bin]]
name = "labdoo-installer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
